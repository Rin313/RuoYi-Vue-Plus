<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 交互式小说引擎 (网文定制版)</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #ff5252; /* 改为更符合战斗网文的绯红色 */
            --secondary-accent: #2196f3;
            --border-color: #444;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; /* 优化中文字体 */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 布局容器 */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧：设置与状态面板 */
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
        }

        /* 中间：故事主区域 */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部标题栏 */
        header {
            background-color: #111;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1, h2, h3 { margin: 0 0 10px 0; font-weight: normal; }
        h1 { font-size: 1.2rem; color: var(--accent-color); font-weight: bold; letter-spacing: 1px; }
        h3 { font-size: 1rem; color: #aaa; border-bottom: 1px solid #555; padding-bottom: 5px; margin-top: 15px;}

        /* 表单元素 */
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
        input, textarea, select {
            width: 100%;
            background: #111;
            border: 1px solid #555;
            color: #ccc;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.4;
        }
        textarea { resize: vertical; min-height: 60px; font-size: 0.9rem; }

        /* 按钮 */
        button {
            cursor: pointer;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: #d32f2f; }
        .btn-secondary { background-color: var(--secondary-accent); color: white; }
        .btn-secondary:hover { background-color: #1976d2; }
        .btn-danger { background-color: #f44336; color: white; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        /* 故事显示区 */
        #story-display {
            flex: 1;
            padding: 30px; /* 增加内边距 */
            overflow-y: auto;
            font-size: 1.15rem; /* 稍微调大字号更像阅读APP */
            line-height: 1.8;
        }

        .message { margin-bottom: 25px; max-width: 90%; }
        .message.user { align-self: flex-end; text-align: right; margin-left: auto; color: #bbb; font-style: italic; border-right: 3px solid #666; padding-right: 10px;}
        .message.ai { 
    color: #eee; 
    white-space: pre-wrap; /* 关键：保留空格和换行符，自动换行 */
    text-align: left; /* 建议改为 left，justify 在 pre-wrap 下有时会导致中文间距奇怪 */
    line-height: 1.8;
}
        
        /* 打字机光标 */
        .cursor::after { content: '▋'; animation: blink 1s infinite; color: var(--accent-color); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* 底部输入区 */
        .input-area {
            background-color: var(--panel-bg);
            padding: 15px;
            border-top: 1px solid var(--border-color);
        }
        .input-row { display: flex; gap: 10px; }
        .input-row textarea { margin-bottom: 0; height: 50px; }

        /* 角色卡片 */
        .char-card {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid #666;
            font-size: 0.85rem;
        }
        .char-card.player { border-left-color: var(--accent-color); }
        .char-name { font-weight: bold; display: flex; justify-content: space-between; }
        .char-attr { margin-top: 5px; color: #ccc; font-size: 0.8rem; white-space: pre-wrap; font-family: monospace;}
        .tag { font-size: 0.7rem; padding: 2px 4px; border-radius: 3px; background: #444; }
        .tag.p { background: var(--accent-color); color: #fff; }

        /* 状态指示器 */
        #status-bar {
            font-size: 0.8rem;
            color: #888;
            text-align: right;
            margin-top: 5px;
        }
        .chapter-divider {
            text-align: center;
            color: var(--secondary-accent);
            margin: 30px 0;
            position: relative;
            font-size: 0.9rem;
        }
        .chapter-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #333;
            z-index: -1;
        }
        .chapter-divider span {
            background: var(--bg-color);
            padding: 0 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>🖋️ NovelGen AI (网文版)</h1>
    <div>
        <button id="reset-btn" class="btn-danger" style="padding: 5px 10px; font-size: 0.8rem;">重启故事</button>
    </div>
</header>

<div class="container">
    <!-- 左侧面板：各种设定 -->
    <div class="sidebar">
        <h3>世界观与设定 (Context)</h3>
        <!-- 为了符合 Implict Caching，这里的内容默认会很多且放在开头 -->
        <label>世界观 (World Setting)</label>
        <textarea id="world-setting" rows="5"></textarea>
        
        <label>主线故事 (Main Storyline)</label>
        <textarea id="main-storyline" rows="3"></textarea>
        
        <label>写作风格 (Style Guide)</label>
        <!-- 增加高度以便查看详细规则 -->
        <textarea id="writing-style" rows="8"></textarea>

        <h3>动态摘要 (Dynamic Summary)</h3>
        <label>前文摘要 (Previous Summary)</label>
        <textarea id="prev-summary" rows="6" readonly style="background: #222; color: #888;"></textarea>

        <h3>登场角色 (Characters)</h3>
        <div id="character-list">
            <!-- 角色列表动态生成 -->
        </div>
    </div>

    <!-- 右侧面板：游戏交互 -->
    <div class="main-stage">
        <div id="story-display">
            <div class="message ai">系统加载完毕。世界观构建完成。<br>请确认左侧设定，在下方输入主角的第一个行动。</div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <textarea id="user-input" placeholder="输入行为（如：'我推开生锈的铁门'）或 剧情指令（如：'突然传来一声尖叫'）..."></textarea>
                <button id="send-btn" class="btn-primary" style="width: 80px;">推进</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <div id="status-bar">本章轮次: <span id="turn-count">0</span></div>
                <button id="conclude-btn" class="btn-secondary" style="font-size: 0.9rem;">章节结算 (下一章)</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 默认数据 (修改为中文网文/都市异能风格) ---
    
    const defaultWorld = `背景：2035年，红月降临，全球灵气复苏。大约 1% 的人类觉醒了异能，被称为“升格者”。
与此同时，现实世界开始与“深渊”重叠，各地频繁出现“禁墟”（副本）。
为了对抗禁墟中的魔物，各国成立了官方组织。华夏的组织名为“守夜人”。
设定：
1. 精神力等级：从低到高为“池境”到“海境”，再到“无量”。
2. 禁物：拥有特殊能力的物品，使用有代价。
3. 氛围：表面是现代都市，暗地里危机四伏，霓虹灯下潜伏着怪物。`;

    const defaultStoryline = `主角“林七”是沧南市高二学生，刚觉醒了神秘的序列号003异能，被招募进守夜人小队“136小队”。
当前剧情：你正在执行第一次实战任务。地点是荒废的“第三精神病院”，情报显示这里有一只“鬼面人”正在进化。
目标：潜入医院，找到并肃清鬼面人，同时保护随行的普通人目击者。`;
// 1. 黄金结构：叙述（环境/动作） -> 对话（冲突/信息） -> 叙述（心理/后果）。
// 2. 比例控制：每 3-5 句对白，必须插入一次动作或环境叙述。
    // 核心修改：将客户要求的“黄金结构公式”完整注入
    const defaultStyle = `核心规则：
1. 叙述限制：单次叙述不超过 120 字。
2. 叙事逻辑：在构思回复时，请在内心遵循“先描写环境氛围与感官细节，再描述角色动作与心理，最后推进对话或冲突”的逻辑流。`;

    const defaultCharacters = [
        {
            name: "林七",
            baseDescription: "17岁，高中生。表面吊儿郎当，实则冷静腹黑。异能是【凡尘神域】（使所有超自然力量无效化）。",
            currentAttributes: "精神力: 220 (池境), 状态: 警惕, 武器: 直刀'黑月'",
            isPlayer: true
        },
        {
            name: "赵空城",
            baseDescription: "30岁，136小队老队员，大叔。没有异能，靠肉体和制式装备战斗。是个老烟枪，性格豪爽但有死志。",
            currentAttributes: "HP: 100%, 状态: 抽烟中, 装备: 纹纹果实(误), 合金战刀",
            isPlayer: false
        }
    ];

    // --- 全局状态 ---
    let gameState = {
        novelId: Date.now(),
        context: {
            worldSetting: defaultWorld,
            mainStoryline: defaultStoryline,
            writingStyle: defaultStyle,
            previousSummary: "任务刚刚开始，林七和赵空城站在精神病院生锈的大门前。夜风很冷。"
        },
        characters: JSON.parse(JSON.stringify(defaultCharacters)),
        currentChapterHistory: [], // List<ChatMessage>
        chapterTurnCount: 0,
        pureStoryTextBuffer: "" // 累积本章的纯文本，用于结算
    };

    // --- DOM 元素 ---
    const els = {
        world: document.getElementById('world-setting'),
        story: document.getElementById('main-storyline'),
        style: document.getElementById('writing-style'),
        summary: document.getElementById('prev-summary'),
        charList: document.getElementById('character-list'),
        display: document.getElementById('story-display'),
        input: document.getElementById('user-input'),
        sendBtn: document.getElementById('send-btn'),
        concludeBtn: document.getElementById('conclude-btn'),
        turnCount: document.getElementById('turn-count'),
        resetBtn: document.getElementById('reset-btn')
    };

    // --- 初始化 ---
    function init() {
        els.world.value = gameState.context.worldSetting;
        els.story.value = gameState.context.mainStoryline;
        els.style.value = gameState.context.writingStyle;
        els.summary.value = gameState.context.previousSummary;
        renderCharacters();

        els.sendBtn.addEventListener('click', handleUserAction);
        els.concludeBtn.addEventListener('click', concludeChapter);
        els.resetBtn.addEventListener('click', () => location.reload());
        
        // 绑定输入框 Enter 发送 (Shift+Enter 换行)
        els.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleUserAction();
            }
        });
    }

    // --- 渲染逻辑 ---
    function renderCharacters() {
        els.charList.innerHTML = '';
        gameState.characters.forEach(char => {
            const div = document.createElement('div');
            div.className = `char-card ${char.isPlayer ? 'player' : ''}`;
            div.innerHTML = `
                <div class="char-name">
                    ${char.name} ${char.isPlayer ? '<span class="tag p">YOU</span>' : '<span class="tag">NPC</span>'}
                </div>
                <div style="font-size:0.75rem; color:#888; margin-bottom:4px;">${char.baseDescription}</div>
                <div class="char-attr">${char.currentAttributes}</div>
            `;
            els.charList.appendChild(div);
        });
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        if (role === 'ai') {
            div.classList.add('cursor'); // 添加光标效果
        }
        div.innerText = text; // 初始文本
        els.display.appendChild(div);
        scrollToBottom();
        return div;
    }

    function scrollToBottom() {
        els.display.scrollTop = els.display.scrollHeight;
    }

    // --- 核心业务逻辑：流式生成 (/api/story/play/stream) ---
        // --- 核心业务逻辑：流式生成 (/api/story/play/stream) ---
    async function handleUserAction() {
        const text = els.input.value.trim();
        if (!text) return;

        // 1. UI 更新
        appendMessage('user', text);
        els.input.value = '';
        setLoading(true);

        // 2. 准备请求数据
        gameState.context.worldSetting = els.world.value;
        gameState.context.mainStoryline = els.story.value;
        gameState.context.writingStyle = els.style.value;

        const requestBody = {
            novelId: gameState.novelId,
            userAction: text,
            context: gameState.context,
            characters: gameState.characters,
            currentChapterHistory: gameState.currentChapterHistory
        };

        gameState.currentChapterHistory.push({ role: 'user', content: text });

        try {
            const response = await fetch('/api/story/play/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error('Network error');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let aiResponseText = "";
            const aiMsgDiv = appendMessage('ai', ''); 
            
            let buffer = ""; 

            // 5. 读取流 (修复后的逻辑)
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                buffer += chunk;

                const lines = buffer.split('\n');
                // 保留最后一行（因为它可能是不完整的）
                buffer = lines.pop(); 

                for (const line of lines) {
                    const trimmedLine = line.trim();
                    
                    // 忽略 SSE 的 event 行或空行
                    if (!trimmedLine || trimmedLine.startsWith('event:')) {
                        continue;
                    }

                    if (trimmedLine.startsWith('data:')) {
                        // 截取 data: 之后的内容
                        // 注意：substring(5) 会保留 data: 紧随其后的内容
                        // 如果后端发送的是 "data:内容"，这很完美
                        // 如果后端发送的是 "data: 内容" (有个空格)，这里会保留空格，通常也是对的
                        let content = line.substring(5);
                        
                        // 1. 处理结束标识 [DONE]
                        if (content.trim() === '[DONE]') {
                            console.log("Stream finished.");
                            break; 
                        }

                        // 2. 过滤逻辑注释 (保留你的原有逻辑)
                        if (content.trim().startsWith('<!-- Logic')) {
                            continue;
                        }

                        // 3. 拼接文本 (修复：不要盲目加 \n)
                        // 如果 content 本身就是换行意图，通常后端会发 "\n" 字符或者前端判断空串
                        // 这里我们直接拼接，让 CSS 的 white-space: pre-wrap 处理换行
                        if (content.length > 0) {
                             aiResponseText += content; 
                        } else {
                             // 如果收到空的 data:，有些实现是作为心跳，有些是换行
                             // 既然你的 css 设置了 pre-wrap，如果后端真的想换行，会在文本里带 \n
                             // 这里安全起见，可以忽略纯空 data，或者视情况添加
                             // aiResponseText += "\n"; // 视你的后端实现而定，通常不需要手动加
                        }
                        
                        aiMsgDiv.innerText = aiResponseText; 
                        scrollToBottom();
                    }
                }
            }

            // 6. 生成结束处理
            aiMsgDiv.classList.remove('cursor');
            
            // 只有当真正生成了内容时才更新状态
            if (aiResponseText.trim().length > 0) {
                gameState.currentChapterHistory.push({ role: 'model', content: aiResponseText });
                gameState.pureStoryTextBuffer += (aiResponseText + "\n");
                gameState.chapterTurnCount++;
                els.turnCount.innerText = gameState.chapterTurnCount;
            }

        } catch (error) {
            console.error(error);
            appendMessage('ai', '系统错误：生成失败，请重试。');
        } finally {
            setLoading(false);
        }
    }

    // --- 核心业务逻辑：章节结算 (/api/story/chapter/conclude) ---
    async function concludeChapter() {
        if (!confirm("确定要结束当前章节吗？系统将生成新摘要并更新角色状态。")) return;

        setLoading(true);
        
        // 构造请求
        const requestBody = {
            context: gameState.context,
            characters: gameState.characters,
            pureStoryText: gameState.pureStoryTextBuffer
        };

        try {
            const response = await fetch('/api/story/chapter/conclude', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error('Conclude failed');

            const result = await response.json(); 

            // 1. 更新摘要
            gameState.context.previousSummary = result.newSummary;
            els.summary.value = result.newSummary;

            // 2. 更新角色状态
            if (result.characterUpdates) {
                result.characterUpdates.forEach(update => {
                    const targetChar = gameState.characters.find(c => c.name === update.name);
                    if (targetChar) {
                        targetChar.currentAttributes = update.newAttributes;
                    }
                });
                renderCharacters();
            }

            // 3. 清理章节状态
            gameState.currentChapterHistory = [];
            gameState.pureStoryTextBuffer = "";
            gameState.chapterTurnCount = 0;
            els.turnCount.innerText = 0;

            // 4. UI 提示
            const divider = document.createElement('div');
            divider.className = 'chapter-divider';
            divider.innerHTML = '<span>章节结算 · 存档已更新</span>';
            els.display.appendChild(divider);
            
            appendMessage('ai', `【系统】章节结算完成。\n新的前情提要：${result.newSummary}\n角色状态已更新。请开始新的章节。`);

        } catch (error) {
            console.error(error);
            alert("结算失败，请查看控制台");
        } finally {
            setLoading(false);
        }
    }

    function setLoading(isLoading) {
        els.sendBtn.disabled = isLoading;
        els.concludeBtn.disabled = isLoading;
        els.input.disabled = isLoading;
        if (isLoading) {
            els.sendBtn.classList.add('btn-disabled');
            els.concludeBtn.classList.add('btn-disabled');
        } else {
            els.sendBtn.classList.remove('btn-disabled');
            els.concludeBtn.classList.remove('btn-disabled');
            els.input.focus();
        }
    }

    // 启动
    init();

</script>
</body>
</html>
